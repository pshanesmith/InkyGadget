# Copy to /etc/inkyframe/config.toml (the installer does this). No secrets are needed: the frame never logs in to Home Assistant.

[photos]
dir = "/srv/inkyframe/Images"        # the folder shared over SMB
state_dir = "/var/lib/inkyframe"     # fitted copies of the photos and the rotation history
refresh_times = ["00:00"]            # show a new photo (and the new date) at these local times
interval_minutes = 0                 # also rotate every N minutes; 0 = only at refresh_times; at least 5
bar_colour = "white"                 # "white" or "black" around photos that do not fill the screen
max_pixels = 25000000                # larger photos are skipped (a HEIC streams in about 10 MB; a JPEG or PNG needs 3 to 4 bytes a pixel)

[display]
saturation = 0.5                     # 0.0 to 1.0, Pimoroni's default
min_refresh_seconds = 300            # the panel flashes for about 30 s per refresh; this is a floor

[overlay]
enabled = true
date_format = "%A %B %-d"            # top left, e.g. Thursday October 29 (%a %b for Thu Oct)
units = "fahrenheit"                 # top right high/low: "fahrenheit" or "celsius"
scale = 2                            # 1 to 4; the font is 11 px x this (2 = 22 px)
margin = 0                           # pixels between the plates and the panel edge; 0 = right in the corners
plate = "auto"                       # "auto" (contrasts with the photo), "light" or "dark"
show_air = true                      # bottom-left plate with CO2, temperature and humidity (needs [sensor] enabled)

# Sensirion SCD40 CO2/temperature/humidity sensor (Adafruit SCD-40) on the Pi's I2C pins. Needs the setup script's I2C step.
[sensor]
enabled = false
i2c_bus = 1                          # /dev/i2c-1: header pins 3 (SDA) and 5 (SCL)
low_power = false                    # one sample every 30 s instead of 5 s
temperature_offset_c = 4.0           # 0 to 175; subtracted to cancel the heat of the board; tune it as the README's "Calibrating the temperature" describes
altitude_m = 0                       # metres above sea level (CO2 compensation)
pressure_hpa = 0                     # ambient pressure; overrides altitude_m when not 0
auto_calibration = true              # assumes fresh air (about 400 ppm) now and then; turn off for a room that is never aired
thresholds_ppm = [800, 1000, 1500, 2000, 5000]   # CO2 where air quality drops from Good to Fair, Moderate, Poor, Very poor, Extremely poor

# Matter: shows the frame to Home Assistant, Apple Home etc. as an Air Quality Sensor (CO2, temperature, humidity).
# Needs [sensor] enabled and a build with the matter feature.
[matter]
enabled = false
device_name = "InkyGadget"
buttons = false                      # show buttons A, B and C to Home Assistant as push buttons (events); D stays the frame's: tap = next photo, hold 3 s = pairing code
long_press_ms = 500                  # holding this long is a long press
multi_press_ms = 300                 # a tap is reported this much later (it waits to see whether a second tap follows)

[location]
# Filled in by: inkyframe geocode 10001 --config /etc/inkyframe/config.toml
postal_code = ""
latitude = 0.0
longitude = 0.0
label = ""
