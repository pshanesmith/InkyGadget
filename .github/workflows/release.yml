# Push a tag vX.Y.Z (matching Cargo.toml) to build the ARMv6 Pi release and publish it.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-gnueabihf
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - name: tag matches Cargo.toml
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "${GITHUB_REF_NAME}"
      - run: cargo test --locked
      - run: tools/cross-build.sh
      - run: tools/package-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/inkyframe-armv6.tar.gz
            dist/inkyframe-armv6.tar.gz.sha256
            dist/install.sh
