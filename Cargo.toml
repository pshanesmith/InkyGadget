[package]
name = "inkyframe"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Bedside photo frame for a Pimoroni Inky Impression 5.7 inch e-paper display on a Raspberry Pi Zero W"
license = "GPL-3.0-only"
repository = "https://github.com/pshanesmith/InkyGadget"
readme = "README.md"

[lib]
name = "inkyframe"
path = "src/lib.rs"

[[bin]]
name = "inkyframe"
path = "src/main.rs"

[features]
default = []
# The SPI/GPIO display driver and button reader. Linux only, so it is off for Mac development;
# the Pi build (tools/cross-build.sh) turns it on.
hardware = ["dep:spidev", "dep:gpiocdev", "dep:linux-embedded-hal"]
# A Matter air-quality sensor node (rs-matter), commissioned over the network.
matter = ["dep:rs-matter", "dep:rand10", "dep:embassy-futures", "dep:embassy-time", "dep:embassy-time-queue-utils", "dep:async-io", "dep:futures-lite", "dep:if-addrs", "dep:socket2"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
env_logger = { version = "0.11", default-features = false }
ab_glyph = "0.2"
font8x8 = { version = "0.3", default-features = false, features = ["std"] }
heic-rs = { version = "0.1.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "thread_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
# The SCD40 driver, in its own repository (not yet on crates.io).
sensirion-scd4x = { git = "https://github.com/pshanesmith/scd4x-rust", tag = "v0.1.0" }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Matter (feature "matter"), versions as in rs-matter's own examples.
rs-matter = { version = "0.4.1", optional = true, features = ["async-io"] }
rand10 = { package = "rand", version = "0.10", optional = true, default-features = false, features = ["std", "std_rng", "thread_rng"] }
embassy-futures = { version = "0.1", optional = true }
embassy-time = { version = "0.5", optional = true, features = ["std"] }
embassy-time-queue-utils = { version = "0.3", optional = true, features = ["generic-queue-64"] }
async-io = { version = "2", optional = true }
futures-lite = { version = "2", optional = true }
if-addrs = { version = "0.15", optional = true }
socket2 = { version = "0.6", optional = true, features = ["all"] }

# On a Mac, Bonjour (mDNSResponder) advertises the node: the built-in responder cannot share the multicast sockets there.
[target.'cfg(target_os = "macos")'.dependencies]
rs-matter = { version = "0.4.1", optional = true, features = ["async-io", "astro-dnssd"] }

[target.'cfg(target_os = "linux")'.dependencies]
spidev = { version = "0.7", optional = true }
gpiocdev = { version = "0.7", optional = true }
# I2C bus access for the sensor (embedded-hal 1.0 traits over /dev/i2c-N).
linux-embedded-hal = { version = "0.4", default-features = false, features = ["i2c"], optional = true }

[dev-dependencies]
futures-lite = "2"
rqrr = "0.10.1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
